<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORXELIA 法務審査ゲート｜非公開プレビュー</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#15263a;margin:0}main{max-width:800px;margin:auto;padding:30px 18px}h1{font-size:24px}.note{color:#5b6574}.panel{background:white;border:1px solid #dce3eb;border-radius:14px;padding:18px;margin:16px 0}.item{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:1px solid #e8edf1;padding:13px 0}.item:last-child{border:0}select,input{padding:9px;border:1px solid #c6ced8;border-radius:8px;max-width:100%}.fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.fields input{width:145px}button{background:#162c46;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.status{font-weight:bold}#issues{white-space:pre-line}.warning{color:#9a4d0d}</style></head><body><main><h1>ORXELIA｜法務審査</h1><p class="note">作業ブランチ専用の画面試作です。実際の承認・データ保存・本番公開は行いません。</p><section class="panel"><label>審査対象事業 <input id="business" value="Partner Link（サンプル）"></label><p class="note">法務審査はAIによる適法性の保証ではありません。一次資料を確認し、必要に応じて専門家に相談してください。</p></section><section class="panel"><h2>必須7分野</h2><div id="checks"></div></section><section class="panel"><h2>審査結果</h2><p id="result" class="status warning">未審査</p><p id="issues"></p><button id="approve" disabled>開発承認申請（デモ）</button><p class="note">審査通過後も本人の開発許可が必要です。販売・決済・公開は別途承認です。</p></section></main><script type="module">import {CHECKS,assessLegalGate} from './legal-gate.mjs';const box=document.querySelector('#checks');const data={version:'draft-v1',checks:{},risks:[]};for(const c of CHECKS){const el=document.createElement('div');el.className='item';el.innerHTML='<div><strong></strong><div class="fields"><input placeholder="根拠URL・文書名"><input placeholder="確認者"><input type="date"></div></div><select aria-label="審査状態"><option value="unreviewed">未審査</option><option value="in_review">確認中</option><option value="expert_review">専門家確認</option><option value="blocked">問題あり</option><option value="passed">確認済み</option></select>';el.querySelector('strong').textContent=c.label;box.append(el);const [evidence,reviewer,date]=el.querySelectorAll('input');const status=el.querySelector('select');for(const input of [evidence,reviewer,date,status])input.addEventListener('input',()=>{data.checks[c.id]={status:status.value,evidence:evidence.value.trim()?[evidence.value.trim()]:[],reviewer:reviewer.value.trim(),reviewedAt:date.value};render()})}function render(){const r=assessLegalGate(data);document.querySelector('#result').textContent=r.eligible?'一次審査完了（開発申請の条件充足）':'保留：法務ゲート未通過';document.querySelector('#issues').textContent=r.findings.map(x=>x.id+'：'+x.reason).join('\n')||'必須項目は入力済みです。根拠の真偽は別途確認してください。';document.querySelector('#approve').disabled=!r.eligible}render();document.querySelector('#approve').addEventListener('click',()=>alert('画面試作です。実際の承認申請は送信されません。'));</script></body></html>
