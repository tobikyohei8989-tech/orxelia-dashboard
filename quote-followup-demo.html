<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>追客管理の試作</title><style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:24px;background:#0b0e16;color:#f4eee3}
h1{font-size:26px}p{line-height:1.7;color:#bbc5d7}
label{display:inline-block;margin:10px 18px 10px 0}input,select,button{padding:10px;background:#1b2335;color:inherit;border:1px solid #67728a;border-radius:6px;font:inherit}
#metrics{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}#metrics span{padding:16px;background:#151d2d;border-radius:8px}
.table{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #303649}
button{cursor:pointer}form{margin-block:1rem}#notice{min-height:1.5em}.due{color:#e5c995}.review{color:#ffbc9e}

#economics{margin-block:2rem;padding:1rem;border:1px solid #67728a;border-radius:8px}
#economics input{width:8rem}
#projection{display:block;line-height:1.7}
#economics th,#economics td{text-align:right}
#economics th:first-child{text-align:left}
#economics .loss{color:#ffbc9e}
</style><h1>見積もり催促・追客管理</h1>
<p>今日対応する見積と、期限の確認が必要な見積を一覧で確認できます。社内試作のため、案件名には社内管理番号などを使ってください。</p>
<label>データ <select id="mode"><option value="work">社内試作（端末に保存）</option><option value="sample">操作確認（架空20件）</option></select></label>
<form id="add"><label>案件名・管理番号 <input name="customer" required maxlength="100"></label>
<label>次の対応日 <input name="nextDate" type="date"></label><button>案件を追加</button></form>
<p id="notice" role="status"></p>
<label>基準日 <input id="day" type="date"></label>
<label>表示 <select id="filter"><option value="due">追客対象</option><option value="all">全件</option><option value="review">期限の確認が必要</option></select></label>
<div id="metrics" role="status"></div><div class="table"><table><thead><tr><th>見積</th><th>案件名・管理番号</th><th>対応状況</th><th>次の対応日</th><th>判定</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<section id="economics" aria-labelledby="economics-title">
<h2 id="economics-title">販売判断｜月次試算</h2>
<p>価格・費用・契約数の仮定を入力すると、3シナリオの売上と利益が比較できます。販売実績は未確認です。</p>
<form id="assumptions">
<label>月額単価（税抜・円）<input name="price" type="number" min="0" max="1000000000" step="1" value="1480" required></label>
<label>月間固定費（円）<input name="fixed" type="number" min="0" max="1000000000" step="1" required></label>
<label>1契約あたり月間原価（円）<input name="variable" type="number" min="0" max="1000000000" step="1" required></label>
<label>有料契約数・低位<input name="low" type="number" min="0" max="1000000" step="1" required></label>
<label>有料契約数・基準<input name="base" type="number" min="0" max="1000000" step="1" required></label>
<label>有料契約数・高位<input name="high" type="number" min="0" max="1000000" step="1" required></label>
<button>試算する</button>
</form>
<p>原価には決済手数料や契約ごとに発生する費用を、固定費にはサーバー代や月次の運用工数を金額に換算して含めます。月額1,480円は既存の価格仮説です。</p>
<div id="projection" aria-live="polite">原価と契約数を入力すると表示されます。</div>
</section>
<script>
"use strict";

function validDay(value) {
  return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
    Number.isFinite(Date.parse(value)) && new Date(value).toISOString().slice(0,10) === value;
}
function needsFollowUp(row, day) {
  return row.status === "未対応" && validDay(row.nextDate) && row.nextDate <= day;
}

const samples=[{"id":"Q01","customer":"架空顧客01","status":"未対応","nextDate":"2026-11-01"},{"id":"Q02","customer":"架空顧客02","status":"未対応","nextDate":"2026-11-02"},{"id":"Q03","customer":"架空顧客03","status":"未対応","nextDate":"2026-11-03"},{"id":"Q04","customer":"架空顧客04","status":"未対応","nextDate":"2026-11-04"},{"id":"Q05","customer":"架空顧客05","status":"未対応","nextDate":"2026-11-05"},{"id":"Q06","customer":"架空顧客06","status":"対応済み","nextDate":"2026-11-01"},{"id":"Q07","customer":"架空顧客07","status":"対応済み","nextDate":"2026-11-02"},{"id":"Q08","customer":"架空顧客08","status":"対応済み","nextDate":"2026-11-03"},{"id":"Q09","customer":"架空顧客09","status":"対応済み","nextDate":"2026-11-04"},{"id":"Q10","customer":"架空顧客10","status":"対応済み","nextDate":"2026-11-05"},{"id":"Q11","customer":"架空顧客11","status":"未対応","nextDate":"2026-11-06"},{"id":"Q12","customer":"架空顧客12","status":"未対応","nextDate":"2026-11-07"},{"id":"Q13","customer":"架空顧客13","status":"未対応","nextDate":"2026-11-08"},{"id":"Q14","customer":"架空顧客14","status":"未対応","nextDate":"2026-11-09"},{"id":"Q15","customer":"架空顧客15","status":"未対応","nextDate":"2026-11-10"},{"id":"Q16","customer":"架空顧客16","status":"未対応","nextDate":"2026-11-11"},{"id":"Q17","customer":"架空顧客17","status":"未対応","nextDate":"2026-11-12"},{"id":"Q18","customer":"架空顧客18","status":"未対応","nextDate":"2026-11-13"},{"id":"Q19","customer":"架空顧客19","status":"未対応","nextDate":"2026-11-14"},{"id":"Q20","customer":"架空顧客20","status":"未対応","nextDate":""}];
const el=id=>document.getElementById(id);
const storageKey="orxelia-quote-pilot-v1";
const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo"}).format(new Date());
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
let work=[];
let readable=true;
try {
 const saved=JSON.parse(localStorage.getItem(storageKey) ?? "[]");
 if(!Array.isArray(saved)||!saved.every(row=>row && typeof row.id==="string" &&
    typeof row.customer==="string" && ["未対応","対応済み"].includes(row.status) &&
    (row.nextDate==="" || validDay(row.nextDate))) ||
    new Set(saved.map(row=>row.id)).size!==saved.length) throw Error();
 work=saved;
} catch {
 readable=false;
 el("notice").textContent="保存データを読み込めません。上書き防止のため入力を停止しました。";
}
el("day").value=today;

function save(next) {
 if(!readable) return false;
 try {
  localStorage.setItem(storageKey,JSON.stringify(next));
  work=next;
  el("notice").textContent="この端末に保存しました。";
  return true;
 } catch {
  el("notice").textContent="保存できませんでした。端末の保存設定と空き容量を確認してください。";
  return false;
 }
}

function render(){
 const sample=el("mode").value==="sample";
 const rows=sample?samples:work;
 el("add").hidden=sample||!readable;
 const day=el("day").value,filter=el("filter").value;
 if(!validDay(day)){el("metrics").textContent="基準日を入力してください。";el("rows").innerHTML="";return;}
 const due=rows.filter(row=>needsFollowUp(row,day));
 const review=rows.filter(row=>row.status==="未対応"&&!validDay(row.nextDate));
 el("metrics").innerHTML="<span>全件 "+rows.length+"件</span><span>追客対象 "+due.length+"件</span><span>期限要確認 "+review.length+"件</span>";
 const visible=filter==="due"?due:filter==="review"?review:rows;
 el("rows").innerHTML=visible.length ? visible.map(row=>{
 const id=escapeHtml(row.id);
 const reference=sample?id:String(work.indexOf(row)+1);
 const verdict=row.status==="対応済み"?"対応済み":!validDay(row.nextDate)?"期限要確認":needsFollowUp(row,day)?"追客対象":"予定";
 return '<tr><td>'+reference+'</td><td>' +escapeHtml(row.customer)+'</td><td><select aria-label="' +id+' 対応状況" data-id="' +id+'" data-field="status">'+["未対応","対応済み"].map(s=>'<option'+(s===row.status?' selected':'')+'>'+s+'</option>').join("")+'</select></td><td><input aria-label="' +id+' 次の対応日" data-id="' +id+'" data-field="nextDate" type="date" value="'+row.nextDate+'"></td><td class="'+(verdict==="追客対象"?"due":verdict==="期限要確認"?"review":"")+'">'+verdict+'</td><td>'+(!sample?'<button type="button" data-remove="'+id+'">削除</button>':'')+'</td></tr>';
 }).join("") : '<tr><td colspan="6">この表示条件に該当する案件はありません。</td></tr>';
}
el("mode").addEventListener("change",()=>{
 const sample=el("mode").value==="sample";
 el("day").value=sample?"2026-11-06":today;
 el("filter").value="due";
 render();
});
el("add").addEventListener("submit",event=>{
 event.preventDefault();
 const values=new FormData(event.target);
 const customer=String(values.get("customer")).trim();
 const nextDate=String(values.get("nextDate"));
 if(!customer || (nextDate && !validDay(nextDate))) return;
 const row={id:crypto.randomUUID(),customer,status:"未対応",nextDate};
 if(save([...work,row])) {
  event.target.reset();
  el("filter").value="all";
  render();
 }
});
el("rows").addEventListener("click",event=>{
 const id=event.target.dataset.remove;
 if(id && el("mode").value==="work" && confirm("この案件を削除しますか？")) {
  if(save(work.filter(row=>row.id!==id))) render();
 }
});
document.addEventListener("change",event=>{
 const {id,field}=event.target.dataset;
 if(field==="status" || field==="nextDate") {
  const value=event.target.value;
  const sample=el("mode").value==="sample";
  if(sample) {
   const row=samples.find(row=>row.id===id);
   if(row) row[field]=value;
  } else {
   save(work.map(row=>row.id===id?{...row,[field]:value}:row));
  }
 }
 render();
});
render();

function projectEconomics({price,fixed,variable,low,base,high}) {
 const contribution=price-variable;
 return {
  contribution,
  breakEven:contribution>0?Math.ceil(fixed/contribution):fixed===0&&contribution===0?0:null,
  scenarios:[low,base,high].map(count=>({
   count,revenue:price*count,cost:fixed+variable*count,profit:contribution*count-fixed
  }))
 };
}

el("assumptions").addEventListener("submit",event=>{
 event.preventDefault();
 const values=Object.fromEntries([...new FormData(event.target)].map(([key,value])=>[key,Number(value)]));
 const output=el("projection");
 if(values.low>values.base||values.base>values.high) {
  output.textContent="契約数は低位 ≤ 基準 ≤ 高位の順で入力してください。";
  return;
 }
 const result=projectEconomics(values);
 const yen=value=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY"}).format(value);
 output.innerHTML="<p>1契約あたりの限界利益 <strong>"+yen(result.contribution)+"</strong> ／ 損益分岐 <strong>"+
  (result.breakEven===null?"黒字化できない条件":result.breakEven+"契約")+"</strong></p>"+
  '<div class="table"><table><thead><tr><th>想定</th><th>有料契約</th><th>月間売上</th><th>月間費用</th><th>月間利益（税引前）</th></tr></thead><tbody>'+
  result.scenarios.map(({count,revenue,cost,profit},index)=>"<tr><th>"+["低位","基準","高位"][index]+"</th><td>"+count+
   "件</td><td>"+yen(revenue)+"</td><td>"+yen(cost)+"</td><td"+(profit<0?' class="loss"':"")+"><strong>"+yen(profit)+"</strong></td></tr>").join("")+
  "</tbody></table></div>";
});
el("assumptions").addEventListener("input",()=>{
 el("projection").textContent="入力が更新されました。試算するボタンで結果を表示します。";
});
</script></html>
