name: ORXELIA private AI developer
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/orxelia-proposal-pipeline.mjs'
      - 'scripts/orxelia-developer.mjs'
      - 'scripts/prototype-quality.mjs'
      - 'scripts/test-prototype-quality.mjs'
      - '.github/workflows/orxelia-developer.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  models: read
concurrency:
  group: orxelia-private-development
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.ORXELIA_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ORXELIA_SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      ORXELIA_MODEL: openai/gpt-4.1-mini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing ORXELIA_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing ORXELIA_SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify submission gate regression tests
        run: node scripts/test-prototype-quality.mjs
      - name: Generate preapproval Gemini designs and approved prototypes by proposal ID
        run: node scripts/orxelia-proposal-pipeline.mjs
      - name: Process legacy date-based jobs without changing their history
        run: node scripts/orxelia-developer.mjs

      - name: Retain synthetic regression evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-quality-${{ github.run_id }}
          path: build/prototype-quality/regression-*/
          if-no-files-found: ignore
          retention-days: 7
