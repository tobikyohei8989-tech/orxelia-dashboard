name: ORXELIA grounded evidence audit
on:
  workflow_dispatch:
    inputs:
      browser_only:
        description: Verify Chromium installation and launch only
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
concurrency:
  group: orxelia-evidence-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.ORXELIA_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ORXELIA_SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate secrets
        if: ${{ !inputs.browser_only }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GEMINI_API_KEY"
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify Chromium launch
        if: ${{ inputs.browser_only }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Collect evidence and smoke-test prototypes
        if: ${{ !inputs.browser_only }}
        run: |
          set +e
          node scripts/orxelia-evidence-audit.mjs
          result=$?
          if [ "$result" -eq 0 ]; then exit 0; fi
          echo "::warning::Audit failed. Retrying once after 90 seconds for transient errors."
          sleep 90
          node scripts/orxelia-evidence-audit.mjs
          exit $?
