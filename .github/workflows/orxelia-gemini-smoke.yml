name: ORXELIA AI business prototype validation
# Isolated business prototype generation and browser validation
on:
  push:
    paths:
      - '.github/workflows/orxelia-gemini-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Generate and browser-test business prototype
        run: node scripts/gemini-smoke-test.mjs
