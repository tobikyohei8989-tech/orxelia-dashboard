
name: ORXELIA AI research feed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: write

concurrency:
  group: orxelia-ai-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checked-out revision and Python syntax
        run: |
          echo "Checked out commit: $(git rev-parse HEAD)"
          git log -1 --format='%h %s'
          python -m py_compile scripts/generate_ai_feed.py
      - name: Generate research feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_ai_feed.py
      - name: Commit changed report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh AI research feed'
            git push
          fi
