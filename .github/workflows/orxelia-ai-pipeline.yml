name: ORXELIA AI proposal development (manual fallback)
on:
  workflow_run:
    workflows: [ORXELIA AI research feed]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_only:
        description: Verify Chromium installation and launch only
        type: boolean
        default: false
  schedule:
    - cron: '15 23 * * *'
permissions:
  contents: read
concurrency:
  group: orxelia-ai-proposal-pipeline
  cancel-in-progress: false
jobs:
  process-next-proposal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.ORXELIA_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ORXELIA_SUPABASE_SERVICE_ROLE_KEY }}
      ORXELIA_DAILY_PROPOSAL_OWNER_ID: ${{ vars.ORXELIA_DAILY_PROPOSAL_OWNER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secrets
        if: ${{ !inputs.browser_only }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY missing"; exit 1; }
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify Chromium launch
        if: ${{ inputs.browser_only }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Process one queued proposal
        if: ${{ !inputs.browser_only }}
        run: node scripts/orxelia-proposal-pipeline.mjs
