<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トビタ店舗設備 | 協力業者手配デモ</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#14253a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#14253a;color:white;padding:22px max(18px,calc((100vw - 960px)/2))}header small{color:#b8c7d8}.wrap{max-width:960px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #dde4eb;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 16px #162b4010}h1{font-size:23px;margin:5px 0}h2{font-size:17px;margin:0 0 15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button,input,select{font:inherit;border-radius:9px;border:1px solid #cbd5e1;padding:10px;background:white}button{cursor:pointer}button.primary{background:#1769c2;color:white;border-color:#1769c2}button:disabled{opacity:.5;cursor:not-allowed}.tabs button.active{background:#14253a;color:white}label{display:block;font-size:13px;color:#526278;margin-bottom:5px}.field{flex:1;min-width:140px}.field input,.field select{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.person,.request{border:1px solid #e0e6ed;border-radius:12px;padding:14px}.muted{color:#627389;font-size:13px}.tag{font-size:12px;padding:4px 8px;border-radius:50px;background:#e8edf2;display:inline-block}.free{background:#d9f5e4;color:#116d3e}.busy{background:#e8edf2;color:#46566a}.hold{background:#fff0c4;color:#885c00}.unknown{background:#ffe6e3;color:#9d3a2f}.notice{background:#e8f3ff;border-radius:10px;padding:12px;font-size:13px}.error{color:#ae2933}.success{color:#116d3e}.stack>*+*{margin-top:10px}table{width:100%;border-collapse:collapse}td,th{padding:9px 5px;border-bottom:1px solid #e8edf2;text-align:left;font-size:13px}.scroll{overflow-x:auto}@media(max-width:520px){h1{font-size:19px}header{padding:18px}button{padding:9px}}
</style></head><body><header><small>TOBITA PARTNER SCHEDULE / 非公開運用前の試作品</small><h1>協力業者 空き日程・手配ボード</h1></header><main class="wrap">
<div class="panel"><div class="notice">これは<strong>サンプルデータだけ</strong>を使うローカル動作デモです。認証・共有・実通知はありません。この端末のブラウザ内だけに保存されます。実名・現場情報を入力しないでください。</div><div class="row between" style="margin-top:12px"><div class="row tabs"><button id="adminTab" class="active" onclick="setMode('admin')">管理者</button><button id="workerTab" onclick="setMode('worker')">職人側（体験）</button></div><button onclick="resetDemo()">デモを初期化</button></div></div>
<section id="adminView"><div class="panel"><h2>空いている職人を探す</h2><div class="row"><div class="field"><label>日付</label><input id="searchDate" type="date" onchange="render()"></div><div class="field"><label>職種</label><select id="tradeFilter" onchange="render()"><option value="">全職種</option><option>電気工事</option><option>冷媒配管</option><option>空調設備</option></select></div><div class="field"><label>時間帯</label><select id="slotFilter" onchange="render()"><option value="am">午前</option><option value="pm">午後</option><option value="all">終日</option></select></div></div><p class="muted">「未回答」は空きとみなしません。仮押さえ中は新しい打診を制限します。</p><div id="workers" class="grid"></div></div><div class="panel"><h2>仕事の打診・確定状況</h2><div id="adminRequests" class="stack"></div></div></section>
<section id="workerView" hidden><div class="panel"><h2>職人さんの操作画面</h2><div class="row"><div class="field"><label>体験する職人</label><select id="workerSelect" onchange="render()"></select></div><div class="field"><label>日付</label><input id="workerDate" type="date" onchange="render()"></div></div><div class="row" style="margin-top:12px"><button onclick="updateAvailability('free')">○ 空き</button><button onclick="updateAvailability('busy')">× 予定あり</button><button onclick="updateAvailability('hold')">△ 仮予定</button><button onclick="updateAvailability('unknown')">？ 未回答</button></div><p class="muted" id="workerState"></p></div><div class="panel"><h2>届いた仕事の打診</h2><div id="workerRequests" class="stack"></div></div></section>
<div class="panel"><h2>変更履歴</h2><div class="scroll"><table><thead><tr><th>日時</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div></div>
</main><script>
const KEY='tobita-schedule-demo-v1',statuses={free:'空き',busy:'予定あり',hold:'仮予定',unknown:'未回答'};
const workersSeed=[{id:'w1',name:'協力業者 A',trade:'電気工事'},{id:'w2',name:'協力業者 B',trade:'冷媒配管'},{id:'w3',name:'協力業者 C',trade:'空調設備'}];
const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const seed=()=>({workers:workersSeed,availability:{},requests:[],history:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(data.requests)||!Array.isArray(data.workers))throw Error('invalid')}catch{data=seed()}
let mode='admin';
function save(action){data.history.unshift({at:new Date().toLocaleString('ja-JP'),action});data.history=data.history.slice(0,40);localStorage.setItem(KEY,JSON.stringify(data));render()}
function setMode(m){mode=m;render()}
function resetDemo(){if(confirm('サンプルデータと操作履歴を初期化しますか？')){data=seed();save('デモを初期化')}}
function statusFor(w,date,slot){const a=data.availability[w+'|'+date]||{};return a[slot]||'unknown'}
function isFree(w,date,slot){return (slot==='all'?['am','pm']:[slot]).every(s=>statusFor(w,date,s)==='free')&& !data.requests.some(r=>r.workerId===w&&r.date===date&&r.status!=='declined'&&r.status!=='cancelled'&&(r.slot==='all'||slot==='all'||r.slot===slot))}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function requestWork(w){const date=document.getElementById('searchDate').value,slot=document.getElementById('slotFilter').value;if(!isFree(w,date,slot)){alert('空き状況が変更されています。再確認してください。');return}const job=prompt('現場名（デモ用の架空名称のみ）','サンプル現場');if(job===null)return;const trimmed=job.trim();if(!trimmed||trimmed.length>80){alert('1〜80文字で入力してください');return}data.requests.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6),workerId:w,date,slot,job:trimmed,status:'pending'});save('仕事を打診：'+w+' / '+date)}
function changeRequest(id,next){const r=data.requests.find(x=>x.id===id);if(!r)return;const allowed={pending:['accepted','declined','cancelled'],accepted:['confirmed','cancelled'],confirmed:['cancelled']};if(!(allowed[r.status]||[]).includes(next)){alert('この状態では操作できません');return}if(next==='accepted'||next==='confirmed'){const conflict=data.requests.some(x=>x.id!==r.id&&x.workerId===r.workerId&&x.date===r.date&&['pending','accepted','confirmed'].includes(x.status)&&(x.slot==='all'||r.slot==='all'||x.slot===r.slot));if(conflict){alert('同じ時間帯に別の依頼があります');return}const slots=r.slot==='all'?['am','pm']:[r.slot];if(slots.some(s=>statusFor(r.workerId,r.date,s)!=='free')){alert('予定が変更されたため承諾・確定できません');return}}r.status=next;save('依頼 '+id+' → '+next)}
function updateAvailability(status){const w=document.getElementById('workerSelect').value,date=document.getElementById('workerDate').value;if(!date)return;const existing=data.requests.some(r=>r.workerId===w&&r.date===date&&['pending','accepted','confirmed'].includes(r.status));if(existing&&status!=='free'){alert('有効な依頼があります。先に管理者と調整してキャンセルしてください。');return}data.availability[w+'|'+date]={am:status,pm:status};save(w+' '+date+' → '+statuses[status])}
const statusLabels={pending:'打診中',accepted:'職人承諾済',confirmed:'手配確定',declined:'辞退',cancelled:'取消'};
function requestCard(r,admin){const w=data.workers.find(x=>x.id===r.workerId);const actions=admin?(r.status==='accepted'?'<button class="primary" onclick="changeRequest(\''+r.id+'\',\'confirmed\')">手配確定</button>':'')+(['pending','accepted','confirmed'].includes(r.status)?'<button onclick="changeRequest(\''+r.id+'\',\'cancelled\')">取消</button>':''):(r.status==='pending'?'<button class="primary" onclick="changeRequest(\''+r.id+'\',\'accepted\')">承諾</button> <button onclick="changeRequest(\''+r.id+'\',\'declined\')">辞退</button>':'');return '<div class="request"><strong>'+escapeHTML(r.job)+'</strong> <span class="tag">'+statusLabels[r.status]+'</span><p class="muted">'+escapeHTML(w?.name||'不明')+' / '+escapeHTML(r.date)+' / '+({am:'午前',pm:'午後',all:'終日'}[r.slot])+'</p><div class="row">'+actions+'</div></div>'}
function render(){document.getElementById('adminView').hidden=mode!=='admin';document.getElementById('workerView').hidden=mode!=='worker';document.getElementById('adminTab').classList.toggle('active',mode==='admin');document.getElementById('workerTab').classList.toggle('active',mode==='worker');const sel=document.getElementById('workerSelect');const previous=sel.value;sel.innerHTML=data.workers.map(w=>'<option value="'+w.id+'">'+escapeHTML(w.name)+'</option>').join('');if(data.workers.some(w=>w.id===previous))sel.value=previous;
const date=document.getElementById('searchDate').value,slot=document.getElementById('slotFilter').value,trade=document.getElementById('tradeFilter').value;document.getElementById('workers').innerHTML=data.workers.filter(w=>!trade||w.trade===trade).map(w=>{const free=isFree(w.id,date,slot);const status=free?'空き':(slot==='all'?[statusFor(w.id,date,'am'),statusFor(w.id,date,'pm')].map(s=>statuses[s]).join(' / '):statuses[statusFor(w.id,date,slot)]);return '<div class="person"><strong>'+escapeHTML(w.name)+'</strong><p class="muted">'+escapeHTML(w.trade)+'</p><p><span class="tag '+(free?'free':'busy')+'">'+escapeHTML(status)+'</span></p><button class="primary" '+(!free?'disabled':'')+' onclick="requestWork(\''+w.id+'\')">仕事を打診</button></div>'}).join('');
document.getElementById('adminRequests').innerHTML=data.requests.length?data.requests.slice().reverse().map(r=>requestCard(r,true)).join(''):'<p class="muted">まだ打診はありません。</p>';
const worker=sel.value,wd=document.getElementById('workerDate').value;document.getElementById('workerState').textContent=wd?'現在：午前 '+statuses[statusFor(worker,wd,'am')]+' / 午後 '+statuses[statusFor(worker,wd,'pm')]:'日付を選んでください';const own=data.requests.filter(r=>r.workerId===worker).slice().reverse();document.getElementById('workerRequests').innerHTML=own.length?own.map(r=>requestCard(r,false)).join(''):'<p class="muted">届いている打診はありません。</p>';document.getElementById('history').innerHTML=data.history.map(h=>'<tr><td>'+escapeHTML(h.at)+'</td><td>'+escapeHTML(h.action)+'</td></tr>').join('')||'<tr><td colspan="2">履歴なし</td></tr>'}
document.getElementById('searchDate').value=localDate();document.getElementById('workerDate').value=localDate();render();
</script></body></html>
