<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空調試運転メモ｜内部試作</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17202b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:24px;margin:0}small{color:#667085}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #15243a10}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #b8c3d1;border-radius:8px;font-size:16px;background:#fff}button{border:0;border-radius:9px;padding:12px 16px;background:#143d66;color:white;font-weight:700;cursor:pointer;margin:6px 5px 6px 0}button.secondary{background:#e5ebf2;color:#24364a}button.danger{background:#a12a2a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{font-size:22px;font-weight:800}.error{color:#b42318}.ok{color:#067647}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e5e9f0;padding:9px 5px;text-align:left;word-break:break-word}#message{min-height:24px} @media print{button,form,#message{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}}
</style></head><body><main><header><h1>空調試運転メモ</h1><small>ORXELIA 内部試作・現場測定値の記録用。合否はメーカー仕様・現場条件で判断してください。</small></header>
<section class="card"><h2>測定を記録</h2><form id="recordForm"><label for="site">現場名</label><input id="site" required maxlength="100" placeholder="例：〇〇店舗"><label for="unit">機器名・系統</label><input id="unit" required maxlength="100" placeholder="例：室内機1号"><div class="grid"><div><label for="mode">運転モード</label><select id="mode"><option>冷房</option><option>暖房</option></select></div><div><label for="date">測定日時</label><input id="date" type="datetime-local" required></div><div><label for="intake">吸込温度（℃）</label><input id="intake" type="number" step=".1" min="-30" max="70" required></div><div><label for="outlet">吹出温度（℃）</label><input id="outlet" type="number" step=".1" min="-30" max="70" required></div><div><label for="speed">吹出風速（m/s）</label><input id="speed" type="number" step=".01" min="0" max="50" required></div><div><label for="note">備考</label><input id="note" maxlength="200" placeholder="任意"></div></div><button type="submit">測定値を保存</button><button class="secondary" type="button" id="clearForm">入力クリア</button></form><p id="message" role="status" aria-live="polite"></p><p id="result" class="result"></p></section>
<section class="card"><h2>保存済み測定 <span id="count">0</span>件</h2><button id="csv" type="button">CSV出力</button><button class="secondary" id="print" type="button">印刷</button><button class="danger" id="erase" type="button">全件削除</button><div style="overflow-x:auto"><table><thead><tr><th>日時</th><th>現場・機器</th><th>モード</th><th>吸込</th><th>吹出</th><th>温度差</th><th>風速</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><small>データはこの端末のブラウザ内にのみ保存されます。同期・クラウド保存・機器連携は未実装です。</small></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),store='orxelia_hvac_trials_v1';let records=[];try{const v=JSON.parse(localStorage.getItem(store)||'[]');records=Array.isArray(v)?v:[]}catch(e){$('message').textContent='保存データを読み込めませんでした';}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(store,JSON.stringify(records));const dt=()=>{const d=new Date();$('date').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};dt();
function render(){$('count').textContent=records.length;$('rows').innerHTML=records.map(r=>'<tr><td>'+escape(r.date)+'</td><td>'+escape(r.site)+' / '+escape(r.unit)+'</td><td>'+escape(r.mode)+'</td><td>'+r.intake+'℃</td><td>'+r.outlet+'℃</td><td>'+r.diff+'℃</td><td>'+r.speed+'m/s</td><td><button class="secondary" type="button" data-id="'+escape(r.id)+'">削除</button></td></tr>').join('')||'<tr><td colspan="8">記録がありません</td></tr>'}render();
$('recordForm').addEventListener('submit',e=>{e.preventDefault();const site=$('site').value.trim(),unit=$('unit').value.trim(),intake=Number($('intake').value),outlet=Number($('outlet').value),speed=Number($('speed').value);if(!site||!unit||!$('date').value||!Number.isFinite(intake)||!Number.isFinite(outlet)||!Number.isFinite(speed)||intake < -30||intake >70||outlet < -30||outlet>70||speed<0||speed>50){$('message').textContent='入力内容を確認してください';$('message').className='error';return;}const diff=Number(Math.abs(intake-outlet).toFixed(1));records.unshift({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),site,unit,mode:$('mode').value,date:$('date').value,intake,outlet,speed,diff,note:$('note').value.trim()});try{save();render();$('result').textContent='温度差 '+diff+'℃';$('message').textContent='保存しました';$('message').className='ok';}catch(e){records.shift();$('message').textContent='保存できませんでした（容量・ブラウザ設定を確認）';$('message').className='error';}});
$('rows').addEventListener('click',e=>{const id=e.target?.dataset?.id;if(!id)return;records=records.filter(r=>r.id!==id);save();render();$('message').textContent='記録を削除しました';});
$('clearForm').onclick=()=>{$('recordForm').reset();dt();$('result').textContent='';$('message').textContent='';};
$('erase').onclick=()=>{if(!records.length)return;if(!confirm('すべての記録を削除しますか？'))return;records=[];save();render();$('message').textContent='すべて削除しました';};
$('print').onclick=()=>window.print();
$('csv').onclick=()=>{const cols=['date','site','unit','mode','intake','outlet','diff','speed','note'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[cols.join(','),...records.map(r=>cols.map(c=>quote(r[c])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='hvac-trials.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);$('message').textContent='CSVを書き出しました';};
})();
</script></body></html>
