<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ORXELIA | 経営ダッシュボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple.png">
<link rel="stylesheet" href="style.css?v=108">
<script src="business-economics.js?v=68" defer></script>
<script src="app.js?v=115" defer></script>
</head>
<body>
<header><div class="wrap brand"><img src="mark.svg" alt="" width="52" height="52"><div><strong>ORXELIA 2.0</strong><small>MANAGEMENT STUDIO</small></div><span class="chip signal">AI調査連携</span></div></header>
<main class="wrap">
<section class="hero"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h1>事業の進み具合</h1><button type="button" id="home-refresh" aria-label="ダッシュボードを再読み込み" style="padding:11px 16px;border-radius:12px;border:1px solid #b6c6d8;background:#fff;color:#18334e;font-weight:700;cursor:pointer;min-height:44px">↻ 再読み込み</button></div><div style="margin:10px 0"><button type="button" id="orxelia-enable-push" style="padding:11px 16px;border-radius:12px;border:1px solid #b6c6d8;background:#fff;color:#18334e;font-weight:700;min-height:44px">🔔 iPhone通知を有効にする</button> <button type="button" id="orxelia-test-local-push" style="padding:11px 16px;border-radius:12px;border:1px solid #b6c6d8;background:#fff;color:#18334e;font-weight:700;min-height:44px">通知表示テスト</button></div><div id="dashboard-update-notice" role="status" aria-live="polite" hidden style="margin:12px 0;padding:12px;border:1px solid #bed3e7;border-radius:12px;background:#eaf4ff;color:#143b60;font-weight:600"></div><div id="work-now" class="work-now"></div><div id="metrics" class="metrics"></div></section>
<nav aria-label="経営ダッシュボード"><button data-tab="home">ホーム</button><button data-tab="portfolio">事業一覧</button><button data-tab="verification">承認・販売</button><button data-tab="finance">収支</button><button data-tab="settings">設定</button></nav>
<p id="notice" role="status"></p>
<section id="view" aria-label="選択中の画面"></section>
<footer>ORXELIA <span>•</span> 同期設定は「設定・データ管理」から</footer>
</main>
<dialog id="editor"><form id="form"><h2 id="form-title"></h2><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<script>document.getElementById("home-refresh").addEventListener("click",function(){this.disabled=true;this.textContent="↻ 更新中…";window.location.reload();});</script></body></html>
