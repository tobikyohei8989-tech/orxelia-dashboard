<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101625">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ORXELIA | 経営ダッシュボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple.png">
<link rel="stylesheet" href="style.css?v=35">
<script src="app.js?v=35" defer></script>
</head>
<body>
<header><div class="wrap brand"><img src="mark.svg" alt="" width="52" height="52"><div><strong>ORXELIA</strong><small>MANAGEMENT STUDIO</small></div><span class="chip signal">手動運用</span></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">EXECUTIVE OVERVIEW</div><h1>経営ダッシュボード</h1><p>事業の現在地と、次の経営判断。</p><div id="metrics" class="metrics"></div></section>
<nav aria-label="経営ダッシュボード"><button data-tab="portfolio">事業一覧</button><button data-tab="daily">日次</button><button data-tab="progress">進捗</button><button data-tab="sales">営業・収益化</button><button data-tab="finance">収支</button><button data-tab="command">経営司令室</button><button data-tab="verification">公開情報検証</button><button data-tab="insights">経営分析</button><button data-tab="tasks">実行タスク</button><button data-tab="decisions">判断</button><button data-tab="settings">管理</button></nav>
<p id="notice" role="status"></p>
<section id="view" aria-label="選択中の画面"></section>
<footer>ORXELIA <span>•</span> 同期設定は「管理」から</footer>
</main>
<dialog id="editor"><form id="form"><h2 id="form-title"></h2><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">キャンセル</button><button class="primary">保存</button></div></form></dialog>
</body></html>
