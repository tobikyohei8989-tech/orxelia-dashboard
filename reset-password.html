<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>パスワード再設定 | ORXELIA</title>
<style>html{color-scheme:light}body{margin:0;background:#eef3f8;color:#182d43;font-family:system-ui,sans-serif;line-height:1.7}main{max-width:440px;margin:8vh auto;padding:30px;background:white;border-radius:20px;box-shadow:0 12px 40px #182d4312}h1{font-size:25px}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:9px;border:1px solid #adbdcd}button{background:#18334e;color:white;cursor:pointer}button:disabled{opacity:.55}a{color:#204f80}#status{white-space:pre-line}small{color:#52677a}@media(max-width:520px){main{margin:24px 16px;padding:24px}}</style><script src="reset-password.js?v=1" defer></script></head>
<body><main><small>ORXELIA / ACCOUNT</small><h1>パスワード再設定</h1><p id="status" role="status" aria-live="polite">認証リンクを確認しています…</p>

<form id="email-form" hidden><label>登録メールアドレス<input name="email" type="email" autocomplete="email" required></label><button type="submit">再設定メールを送る</button></form><p><a href="https://phenomenal-basbousa-1200eb.netlify.app/dashboard/">ダッシュボードへ戻る</a></p></main></body></html>
