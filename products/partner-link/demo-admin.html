const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role="admin", tab='pending', selected=12, free=new Set([9,10,11,12,13,16,17,18,19,20,24,25,26,27]), job={status:'none',day:12,name:'店舗エアコン工事（サンプル）',worker:'佐藤さん（空調・サンプル）',time:'07:30',place:'現場正面駐車場（サンプル）',slot:'all'};
function guide(){return job.status==='none'?'① カレンダーで日付を選び、現場情報を入れて「打診」。承諾するまでは成立しません。':job.status==='pending'?'② 職人の画面で現場名・集合場所を確認し「承諾・確定」。この操作で初めて成立します。':job.status==='confirmed'?'③ 管理者・職人の予定に「決」が表示されました。成立日を押すと仕事の詳細を確認できます。':'辞退した仕事は「終了・取消」で確認できます。最初から体験し直せます。'}
function render(){
 $('events').innerHTML=job.status==='none'?'<p class="muted">お知らせはありません。</p>':'<div class="notice notice-'+(job.status==='confirmed'?'confirmed':job.status==='pending'?'pending':'declined')+'"><div class="notice-main">'+(job.status==='confirmed'?'マッチング成立':job.status==='pending'?'新しい仕事の打診':'辞退')+'：'+esc(job.name)+'</div><div class="notice-meta">11/'+job.day+' · '+esc(job.worker)+' · サンプル</div></div>';
 $('guide').textContent=guide();$('who').textContent=role==='admin'?'管理担当（サンプル）':'佐藤さん（サンプル）';$('role-tag').textContent=role==='admin'?'管理者':'職人';$('role-admin').classList.toggle('active',role==='admin');$('role-worker').classList.toggle('active',role==='worker');
 $('pendingCount').textContent=job.status==='pending'?'(1)':'(0)';$('confirmedCount').textContent=job.status==='confirmed'?'(1)':'(0)';$('historyCount').textContent=job.status==='declined'?'(1)':'(0)';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',tab===b.dataset.tab));
 const show=job.status===tab||(tab==='history'&&job.status==='declined');
 $('requests').innerHTML=show?'<div class="item"><strong>'+esc(job.name)+'</strong> <span class="tag">'+({pending:'打診中',confirmed:'マッチング成立',declined:'辞退'}[job.status])+'</span><p>2026-11-'+job.day+' / '+esc(job.worker)+' / '+({all:'1日',am:'午前',pm:'午後'}[job.slot])+'</p><p>集合時間：'+esc(job.time)+' / 集合場所：'+esc(job.place)+'</p>'+(role==='worker'&&job.status==='pending'?'<button id="accept" class="primary">承諾・確定</button> <button id="decline">辞退</button>':'')+'</div>':'<p class="muted">該当する仕事はありません。</p>';
 $('calendar').innerHTML=['日','月','火','水','木','金','土'].map((d,i)=>'<strong class="weekday '+(i===0?'sun':i===6?'sat':'')+'">'+d+'</strong>').join('')+Array.from({length:30},(_,i)=>{const d=i+1,dow=i%7,matched=d===job.day&&job.status==='confirmed',pending=d===job.day&&job.status==='pending';return '<button class="day '+(dow===0?'sun ':dow===6?'sat ':'')+(matched?'matched ':pending?'busy ':free.has(d)?'free ':'')+(d===selected&&!matched?'selected ':'')+'" data-date="'+d+'" aria-label="11月'+d+'日 '+(matched?'成立':pending?'打診中':free.has(d)?'空き':'予定なし')+'"><span class="day-number">'+d+'</span>'+(matched?'<span class="match-stamp" aria-label="マッチング成立">決</span>':'')+'<small>'+(matched?'成立':pending?'打診中':free.has(d)?'空き':'—')+'</small></button>'}).join('');
 $('chosen').textContent=selected?'1日選択中：11/'+selected:'日付をタップして選択してください';$('adminPanel').hidden=role!=='admin'||!selected||job.status!=='none';$('workerPanel').hidden=role!=='worker';
 document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const d=Number(b.dataset.date);if(d===job.day&&job.status==='confirmed'){ $('dayDetails').hidden=false;$('dayDetails').innerHTML='<div class="row" style="justify-content:space-between"><strong>11/'+d+' の確定した仕事</strong><button id="close-detail">閉じる</button></div><div class="day-detail-item"><strong>'+esc(job.name)+'</strong><div class="muted">'+esc(job.worker)+'<br>集合 '+esc(job.time)+' / '+esc(job.place)+'</div></div>';$('close-detail').onclick=()=>{$('dayDetails').hidden=true};}else{selected=d;render();}});
 if($('accept'))$('accept').onclick=()=>respond('confirmed');if($('decline'))$('decline').onclick=()=>respond('declined');
}
function sync(){parent.postMessage({kind:'partner-demo-state',status:job.status,day:job.day,name:job.name,worker:job.worker,time:job.time,place:job.place,slot:job.slot},'*');}
function respond(status){job.status=status;tab=status==='declined'?'history':'confirmed';$('message').textContent=status==='confirmed'?'承諾しました。マッチング成立です（デモ）。':'辞退しました（デモ）。';render();sync();}
$('role-admin').onclick=()=>{role='admin';render()};$('role-worker').onclick=()=>{role='worker';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$('send').onclick=()=>{if(job.status!=='none'||!selected)return;job={status:'pending',day:selected,name:$('jobName').value.trim()||'店舗工事（サンプル）',worker:$('workerChoice').value,time:$('meetingTime').value||'07:30',place:$('meetingPlace').value.trim()||'現場正面駐車場',slot:$('slot').value};tab='pending';$('message').textContent='打診しました（デモ）。次は「職人の画面」で回答してください。';render();sync();};
$('fresh').onclick=()=>{job.status='none';selected=12;tab='pending';$('message').textContent='デモを最初に戻しました。';render();sync()};document.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{if(selected===job.day&&['pending','confirmed'].includes(job.status)){$('message').textContent='打診中・確定済みの日は、このデモでは空き登録を変更できません。';return;}if(!selected)return;if(b.dataset.free==='clear')free.delete(selected);else free.add(selected);$('message').textContent='11/'+selected+'の空き登録を更新しました（デモ）。';render()});
window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(d?.kind==='partner-demo-role'&&['admin','worker'].includes(d.role)){role=d.role;render();return;}if(d?.kind!=='partner-demo-relay'||!['none','pending','confirmed','declined'].includes(d.status)||!Number.isInteger(d.day)||d.day<1||d.day>30)return;job={status:d.status,day:d.day,name:String(d.name).slice(0,80),worker:String(d.worker).slice(0,60),time:String(d.time).slice(0,5),place:String(d.place).slice(0,100),slot:['am','pm'].includes(d.slot)?d.slot:'all'};tab=d.status==='declined'?'history':d.status==='confirmed'?'confirmed':'pending';render();});
render();
</script></body></html>
